<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Argent Omega</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-oled: #000000;
            --bg-sidebar: #090a0e;
            --bg-surface: #111319;
            --bg-elevated: #181b24;
            --bg-hover: #1f2430;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.18);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-1: #60a5fa;
            --accent-2: #a855f7;
            --accent-3: #34d399;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 52%, #ec4899 100%);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-oled);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        svg {
            display: block;
            flex-shrink: 0;
        }

        /* Animated Brand Spark */
        .spark-svg {
            width: 22px;
            height: 22px;
            color: #c084fc;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.55));
            animation: sparkFloat 4s ease-in-out infinite;
        }

        .spark-svg.thinking {
            animation: sparkSpin 1.6s linear infinite;
            color: #60a5fa;
        }

        /* Sidebar */
        .sidebar {
            width: 268px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            flex-shrink: 0;
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px 16px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.2px;
            color: #ffffff;
        }

        .new-chat-btn {
            width: 100%;
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-active);
        }

        .new-chat-btn:hover svg { transform: rotate(90deg); }
        .new-chat-btn svg { transition: transform 0.25s ease; }

        .sidebar-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: var(--text-muted);
            padding: 6px 10px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 12px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.16s ease;
            gap: 8px;
        }

        .history-item:hover, .history-item.active {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .history-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .history-del {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px;
            border-radius: 6px;
            opacity: 0;
            transition: all 0.15s ease;
        }

        .history-item:hover .history-del,
        .history-item.active .history-del { opacity: 0.7; }

        .history-del:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
            opacity: 1 !important;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-subtle);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .side-action {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .side-action:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .side-action:hover svg {
            color: var(--accent-2);
            transform: scale(1.08);
        }

        .side-action svg {
            width: 17px;
            height: 17px;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 90;
        }

        /* Main Shell */
        .main-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100dvh;
            background: radial-gradient(ellipse 65% 40% at 50% -10%, rgba(99, 102, 241, 0.11) 0%, transparent 65%), var(--bg-oled);
            position: relative;
        }

        /* Topbar */
        .topbar {
            height: 60px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(18px);
            flex-shrink: 0;
            gap: 10px;
            z-index: 40;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .menu-btn {
            display: none;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Custom Pro Model Dropdown (3 Models + SVG Icons) */
        .model-dropdown {
            position: relative;
        }

        .model-trigger {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .model-trigger:hover,
        .model-dropdown.open .model-trigger {
            background: var(--bg-elevated);
            border-color: var(--border-active);
        }

        .model-trigger .m-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-trigger .m-icon svg {
            width: 16px;
            height: 16px;
        }

        .model-trigger .m-chevron {
            width: 14px;
            height: 14px;
            color: var(--text-secondary);
            transition: transform 0.22s ease;
        }

        .model-dropdown.open .model-trigger .m-chevron {
            transform: rotate(180deg);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-3);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
            animation: dotPulse 2.4s infinite ease-in-out;
            flex-shrink: 0;
        }

        .model-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 278px;
            background: rgba(15, 17, 24, 0.96);
            backdrop-filter: blur(22px);
            border: 1px solid var(--border-active);
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.88);
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            pointer-events: none;
            transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .model-dropdown.open .model-menu {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .model-opt {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 10px 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 11px;
            text-align: left;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.16s ease;
        }

        .model-opt:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .model-opt.selected {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.35);
        }

        .opt-icon-box {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .opt-icon-box.gpt { background: rgba(52, 211, 153, 0.12); color: #34d399; }
        .opt-icon-box.qwen { background: rgba(96, 165, 250, 0.12); color: #60a5fa; }
        .opt-icon-box.colab { background: rgba(168, 85, 247, 0.14); color: #c084fc; }

        .opt-icon-box svg { width: 17px; height: 17px; }

        .opt-text {
            flex: 1;
            min-width: 0;
        }

        .opt-title {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.3;
        }

        .opt-sub {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .opt-check {
            width: 16px;
            height: 16px;
            color: #a855f7;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .model-opt.selected .opt-check { opacity: 1; }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s ease;
        }

        .pill-btn svg { width: 15px; height: 15px; }

        .pill-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-active);
            background: var(--bg-elevated);
        }

        .pill-btn.active {
            color: #ffffff;
            border-color: rgba(168, 85, 247, 0.45);
            background: rgba(168, 85, 247, 0.14);
        }

        /* Animated Equalizer Bars (Voice Active) */
        .eq-bars {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            height: 14px;
        }

        .eq-bars i {
            display: block;
            width: 2px;
            height: 5px;
            background: currentColor;
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .eq-bars i:nth-child(2) { height: 10px; }
        .eq-bars i:nth-child(3) { height: 7px; }

        .pill-btn.speaking .eq-bars i {
            animation: eqBounce 0.7s ease-in-out infinite alternate;
            background: var(--accent-1);
        }
        .pill-btn.speaking .eq-bars i:nth-child(2) { animation-delay: 0.18s; }
        .pill-btn.speaking .eq-bars i:nth-child(3) { animation-delay: 0.34s; }

        /* Views */
        .view-pane {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }

        .view-pane.active { display: flex; }

        /* Chat Stream */
        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        .chat-inner {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .hero-welcome {
            margin: 8vh auto 20px;
            text-align: center;
            max-width: 600px;
            padding: 0 10px;
        }

        .hero-emblem {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 32px rgba(139, 92, 246, 0.18);
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 15%, #c4b5fd 60%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.7px;
        }

        .hero-sub {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: left;
        }

        .quick-card {
            background: rgba(17, 19, 25, 0.85);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.22s ease;
        }

        .quick-card:hover {
            background: var(--bg-elevated);
            border-color: var(--border-active);
            transform: translateY(-2px);
        }

        .qc-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-1);
            flex-shrink: 0;
            transition: all 0.22s ease;
        }

        .quick-card:hover .qc-icon {
            background: rgba(139, 92, 246, 0.16);
            border-color: rgba(139, 92, 246, 0.4);
            color: #d8b4fe;
            transform: scale(1.06);
        }

        .qc-icon svg { width: 17px; height: 17px; }

        .quick-card strong {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .quick-card span {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.45;
            display: block;
        }

        /* Messages */
        .msg-row {
            display: flex;
            width: 100%;
            animation: fadeUp 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-row.ai { justify-content: flex-start; }

        .msg-user-bubble {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 20px 20px 4px 20px;
            padding: 12px 17px;
            max-width: 82%;
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-user-thumb {
            max-width: 210px;
            max-height: 185px;
            border-radius: 12px;
            display: block;
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
        }

        .msg-ai-wrap {
            width: 100%;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .ai-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.35);
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-avatar svg { width: 16px; height: 16px; }

        .ai-body-col { flex: 1; min-width: 0; }

        .ai-engine-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: inline-block;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .ai-markdown {
            font-size: 15px;
            line-height: 1.72;
            color: #e4e4e7;
            word-break: break-word;
        }

        .ai-markdown p { margin-bottom: 10px; }
        .ai-markdown p:last-child { margin-bottom: 0; }
        .ai-markdown h3 { font-size: 16px; font-weight: 700; color: #ffffff; margin: 14px 0 6px; }
        .ai-markdown strong { color: #ffffff; font-weight: 600; }
        .ai-markdown ul, .ai-markdown ol { margin: 8px 0 10px 20px; }
        .ai-markdown li { margin-bottom: 4px; }

        .inline-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            background: rgba(255, 255, 255, 0.08);
            color: #d8b4fe;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .code-card {
            background: #07090d;
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            margin: 12px 0;
            overflow: hidden;
        }

        .code-card-head {
            background: #10131c;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .code-copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .code-copy-btn:hover { background: rgba(255, 255, 255, 0.14); }
        .code-copy-btn svg { width: 13px; height: 13px; }

        .code-card pre {
            padding: 14px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            line-height: 1.58;
            color: #a7f3d0;
        }

        .msg-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .mini-act {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .mini-act svg { width: 13px; height: 13px; }

        .mini-act:hover {
            color: var(--text-primary);
            border-color: var(--border-active);
            background: var(--bg-surface);
        }

        .typing-shimmer {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
        }

        .typing-shimmer span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a855f7;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing-shimmer span:nth-child(2) { animation-delay: 0.16s; background: #60a5fa; }
        .typing-shimmer span:nth-child(3) { animation-delay: 0.32s; background: #ec4899; }

        /* Floating Composer */
        .composer-outer {
            width: 100%;
            padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000000 38%);
            flex-shrink: 0;
        }

        .composer-box {
            width: 100%;
            max-width: 800px;
            background: var(--bg-surface);
            border: 1px solid var(--border-active);
            border-radius: var(--radius-xl);
            padding: 11px 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.78);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .composer-box:focus-within {
            border-color: rgba(139, 92, 246, 0.55);
            box-shadow: 0 12px 44px rgba(139, 92, 246, 0.12);
        }

        .attach-strip {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 7px 10px;
            margin-bottom: 9px;
            font-size: 12.5px;
            color: var(--text-primary);
        }

        .attach-strip.show { display: flex; }

        .attach-strip img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 8px;
        }

        function escapeHtml(s) {
            return String(s || "")

        function renderMarkdown(raw) {
            const codeBlocks = [];
            let text = String(raw || "").replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                const idx = codeBlocks.length;
                codeBlocks.push({ lang: lang || "code", code: code.replace(/\n$/, "") });
                return `@@CODEBLOCK_${idx}@@`;
            });

            text = escapeHtml(text);
            text = text.replace(/`([^`\n]+)`/g, `<code class="inline-code">$1</code>`);
            text = text.replace(/\*\*([^*]+)\*\*/g, `<strong>$1</strong>`);
            text = text.replace(/\*([^*\n]+)\*/g, `<em>$1</em>`);

            const lines = text.split("\n");
            let html = "";
            let listType = null;

            const closeList = () => {
                if (listType) { html += `</${listType}>`; listType = null; }
            };

            for (const line of lines) {
                const trimmed = line.trim();
                if (/^@@CODEBLOCK_\d+@@$/.test(trimmed)) {
                    closeList();
                    html += trimmed;
                } else if (/^#{1,3}\s+/.test(trimmed)) {
                    closeList();
                    html += `<h3>${trimmed.replace(/^#{1,3}\s+/, "")}</h3>`;
                } else if (/^[-*•]\s+/.test(trimmed)) {
                    if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
                    html += `<li>${trimmed.replace(/^[-*•]\s+/, "")}</li>`;
                } else if (/^\d+\.\s+/.test(trimmed)) {
                    if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
                    html += `<li>${trimmed.replace(/^\d+\.\s+/, "")}</li>`;
                } else if (trimmed === "") {
                    closeList();
                } else {
                    closeList();
                    html += `<p>${trimmed}</p>`;
                }
            }
            closeList();

            html = html.replace(/@@CODEBLOCK_(\d+)@@/g, (_, i) => {
                const blk = codeBlocks[Number(i)];
                const cid = "cb-" + Math.random().toString(36).slice(2, 9);
                return `
                    <div class="code-card">
                        <div class="code-card-head">
                            <span>${escapeHtml(blk.lang)}</span>
                            <button type="button" class="code-copy-btn" onclick="copyById('${cid}', this)">${SVG_COPY}<span>Copy</span></button>
                        </div>
                        <pre id="${cid}">${escapeHtml(blk.code)}</pre>
                    </div>
                `;
            });

            return html;
        }

        function handleImageUpload(e) {
            const file = e.target.files?.[0];
            e.target.value = "";
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 1024;
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        const scale = Math.min(maxDim / w, maxDim / h);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                    }
                    const canvas = document.createElement("canvas");
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                    pendingImageUri = canvas.toDataURL("image/jpeg", 0.82);
                    pendingFilePayload = null;

                    const thumb = document.getElementById("attachThumb");
                    thumb.src = pendingImageUri;
                    thumb.style.display = "block";
                    document.getElementById("attachInfo").textContent = `Image Ready • ${file.name}`;
                    document.getElementById("attachStrip").classList.add("show");
                    showToast("Image Ready for Vision");
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        async function handleAnyFileUpload(e) {
            const file = e.target.files?.[0];
            e.target.value = "";
            if (!file) return;

            if (file.type.startsWith("image/")) {
                handleImageUpload({ target: { files: [file] } });
                return;
            }

            if (file.size > MAX_FILE_BYTES) {
                showToast("Maximum file limit is 500 MB");
                return;
            }

            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            showToast(`Processing ${file.name} (${sizeMB} MB)...`);

            try {
                let extracted = "";
                if (file.size <= TEXT_CHUNK_CHARS * 2) {
                    extracted = await file.text();
                } else {
                    const headText = await file.slice(0, TEXT_CHUNK_CHARS).text();
                    const tailText = await file.slice(file.size - 8000, file.size).text();
                    extracted = `${headText}\n\n...[Large file ${sizeMB} MB smart-chunked]...\n\n${tailText}`;
                }

                const cleanText = extracted.replace(/[^\x09\x0A\x0D\x20-\x7E\u0980-\u09FF\u0900-\u097F]/g, " ").slice(0, 32000);
                pendingFilePayload = { name: file.name, sizeMB, text: cleanText };
                pendingImageUri = null;

                document.getElementById("attachThumb").style.display = "none";
                document.getElementById("attachInfo").textContent = `${file.name} (${sizeMB} MB)`;
                document.getElementById("attachStrip").classList.add("show");
                showToast("File Attached");
            } catch (err) {
                showToast("File read error");
            }
        }

        function clearAttachment() {

        }

        async function sendMessage() {
            if (isBusy) return;
            const input = document.getElementById("promptInput");
            let userText = input.value.trim();

            if (!userText && !pendingImageUri && !pendingFilePayload) return;
            if (!userText && pendingImageUri) userText = "এই ছবিটি বিশ্লেষণ করো এবং ভেতরের সমস্ত লেখা পরিষ্কারভাবে পড়ে দাও।";
            if (!userText && pendingFilePayload) userText = `এই ফাইলটি (${pendingFilePayload.name}) বিশ্লেষণ করে মূল বিষয়বস্তু বলো।`;

            const mode = activeEngine;

            if (!activeChatId) {
                const newChat = { id: "c-" + Date.now(), title: userText.slice(0, 36), messages: [] };
                chats.unshift(newChat);
                activeChatId = newChat.id;
            }

            const chat = getActiveChat();
            const sentImage = pendingImageUri;
            const sentFile = pendingFilePayload;

            chat.messages.push({
                role: "user",
                content: sentFile ? `[File: ${sentFile.name} • ${sentFile.sizeMB} MB]\n${userText}` : userText,
                image: sentImage || null,
            });

            input.value = "";
            input.style.height = "auto";
            clearAttachment();
            saveChats();
            renderMessages();

            const box = document.getElementById("chatInner");
            const loader = document.createElement("div");
            loader.className = "msg-row ai";
            loader.innerHTML = `
                <div class="msg-ai-wrap">
                    <div class="ai-avatar">${SVG_SPARK_SPIN}</div>
                    <div class="ai-body-col">
                        <div class="ai-engine-tag">THINKING</div>
                        <div class="typing-shimmer"><span></span><span></span><span></span></div>
                    </div>
                </div>
            `;
            box.appendChild(loader);
            scrollToBottom();

            isBusy = true;
            document.getElementById("sendBtn").disabled = true;

            try {
                let res, data;
                const history = chat.messages
                    .slice(0, -1)
                    .slice(-10)
                    .map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.content }));

                if (sentImage) {
                    res = await fetch(`${WORKER_BASE}/vision`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ imageDataUri: sentImage, prompt: userText }),
                    });
                    data = await res.json();
                } else {
                    const finalPrompt = sentFile
                        ? `Attached File: ${sentFile.name} (${sentFile.sizeMB} MB)\n---\n${sentFile.text}\n---\nUser Request: ${userText}`
                        : userText;

                    if (mode === "colab") {
                        const remoteUrl = localStorage.getItem("argent_colab_url") || "";
                        const colabModel = localStorage.getItem("argent_colab_model") || "dolphin-mistral";
                        res = await fetch(`${WORKER_BASE}/remote`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ remoteUrl, model: colabModel, prompt: finalPrompt, history }),
                        });
                    } else {
                        res = await fetch(`${WORKER_BASE}/chat`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ prompt: finalPrompt, history, mode }),
                        });
                    }
                    data = await res.json();
                }

                loader.remove();
                const replyText = data.reply || data.error || "কোনো উত্তর পাওয়া যায়নি।";
                chat.messages.push({ role: "ai", content: replyText, engine: data.engine || mode.toUpperCase() });
                saveChats();
                renderMessages();

                if (ttsEnabled) speakRaw(replyText);
            } catch (err) {
                loader.remove();
                chat.messages.push({ role: "ai", content: `Network Error: ${err.message}`, engine: "OFFLINE" });
                saveChats();
                renderMessages();
            } finally {
                isBusy = false;
                document.getElementById("sendBtn").disabled = false;
            }
        }

        // Speech Recognition (Auto-ready without extra language toggle box)
        function toggleVoiceInput() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return showToast("Speech input unavailable in this browser");

            if (isRecording && recognition) {
                recognition.stop();
                return;
            }

            recognition = new SR();
            recognition.lang = "bn-IN";
            recognition.interimResults = true;
            recognition.continuous = false;

            const btn = document.getElementById("micBtn");
            const input = document.getElementById("promptInput");
            const baseVal = input.value ? input.value + " " : "";

            recognition.onstart = () => {
                isRecording = true;
                btn.classList.add("recording");
                showToast("Listening...");
            };

            recognition.onresult = (ev) => {
                let transcript = "";
                for (let i = 0; i < ev.results.length; i++) {
                    transcript += ev.results[i][0].transcript;
                }
                input.value = baseVal + transcript;
                autoResize(input);
            };

            recognition.onerror = () => { isRecording = false; btn.classList.remove("recording"); };
            recognition.onend = () => { isRecording = false; btn.classList.remove("recording"); };
            recognition.start();
        }

        // Natural Female TTS with Animated Equalizer Indicator
        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById("ttsToggleBtn");
            btn.classList.toggle("active", ttsEnabled);
            btn.classList.remove("speaking");
            document.getElementById("ttsLabel").textContent = ttsEnabled ? "Voice On" : "Muted";
            if (!ttsEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
        }

        function pickBestFemaleVoice(isBengali) {
            const voices = window.speechSynthesis.getVoices() || [];
            const priorityList = isBengali
                ? ["tanishaa", "natural", "online", "google বাংলা", "bn-in", "bn_in", "bengali", "kalpana"]
                : ["ava", "aria", "jenny", "natural", "samantha", "google uk english female", "neerja", "zira", "female"];

            for (const kw of priorityList) {
                const match = voices.find(v => {
                    const name = (v.name + " " + v.lang).toLowerCase();
                    if (isBengali && !v.lang.toLowerCase().startsWith("bn")) return false;
                    return name.includes(kw);
                });
                if (match) return match;
            }
            return voices.find(v => v.lang.toLowerCase().startsWith(isBengali ? "bn" : "en")) || voices[0] || null;
        }

        function speakText(idx) {
            const chat = getActiveChat();
            if (chat && chat.messages[idx]) speakRaw(chat.messages[idx].content);
        }

        function speakRaw(text) {
            if (!("speechSynthesis" in window)) return;
            window.speechSynthesis.cancel();

            const clean = String(text || "")
                .replace(/```[\s\S]*?```/g, " কোডটি স্ক্রিনে দেওয়া হয়েছে। ")
                .replace(/[*_`#>~|]/g, "")
                .replace(/https?:\/\/\S+/g, "")
                .trim()
                .slice(0, 680);

            if (!clean) return;

            const isBengali = /[\u0980-\u09FF]/.test(clean);
            const utter = new SpeechSynthesisUtterance(clean);
            const voice = pickBestFemaleVoice(isBengali);
            if (voice) utter.voice = voice;
            utter.lang = isBengali ? "bn-IN" : "en-US";
            utter.rate = 0.96;
            utter.pitch = 1.04;

            const btn = document.getElementById("ttsToggleBtn");
            utter.onstart = () => btn.classList.add("speaking");
            utter.onend = () => btn.classList.remove("speaking");
            utter.onerror = () => btn.classList.remove("speaking");

            window.speechSynthesis.speak(utter);
        }

        // Studio
        async function generateCloudflareImage() {
            const promptText = document.getElementById("studioPrompt").value.trim();
            if (!promptText) return showToast("Enter an image prompt first");

            const stage = document.getElementById("studioStage");
            stage.innerHTML = `${SVG_SPARK_SPIN}<span style="color:var(--accent-1);font-size:13px;">Generating via Cloudflare FLUX.1...</span>`;

            try {
                const res = await fetch(`${WORKER_BASE}/image`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText }),
                });
                const data = await res.json();
                if (data.dataURI) {
                    latestStudioImage = data.dataURI;
                    stage.innerHTML = `<img src="${data.dataURI}" alt="FLUX Art">`;
                    showToast("FLUX.1 Image Ready");
                } else {
                    stage.innerHTML = `<span style="color:#f87171;">Error: ${escapeHtml(data.error || "Failed")}</span>`;
                }
            } catch (err) {
                stage.innerHTML = `<span style="color:#f87171;">Network Error: ${escapeHtml(err.message)}</span>`;
            }
        }

        function generatePollinationsImage() {
            const promptText = document.getElementById("studioPrompt").value.trim();
            if (!promptText) return showToast("Enter an image prompt first");

            const stage = document.getElementById("studioStage");
            stage.innerHTML = `${SVG_SPARK_SPIN}<span style="color:var(--accent-2);font-size:13px;">Rendering via Pollinations Flux...</span>`;

            const seed = Math.floor(Math.random() * 99999999);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?model=flux&width=1024&height=1024&nologo=true&seed=${seed}`;
            const img = new Image();
            img.onload = () => {
                latestStudioImage = url;
                stage.innerHTML = "";
                stage.appendChild(img);
                showToast("Image Ready");
            };
            img.onerror = () => {
                stage.innerHTML = `<span style="color:#f87171;">Pollinations busy, try Cloudflare FLUX.1</span>`;
            };
            img.src = url;
        }

        async function dispatchKaggleVideo() {
            const promptText = document.getElementById("studioPrompt").value.trim();
            if (!promptText) return showToast("Enter a video prompt first");

            let token = localStorage.getItem("argent_gh_workflow_token");
            if (!token) {
                token = window.prompt("ভিডিও রেন্ডারের জন্য Workflow পারমিশনসহ GitHub Token দিন:");
                if (!token || !token.trim()) return;
                localStorage.setItem("argent_gh_workflow_token", token.trim());
            }

            const stage = document.getElementById("studioStage");
            stage.innerHTML = `${SVG_SPARK_SPIN}<span style="color:var(--accent-2);font-size:13px;">Dispatching Kaggle T4 Wan 2.1 Pipeline...</span>`;

            try {
                const res = await fetch("https://api.github.com/repos/imagitrixlab/sys-arg-x9872/actions/workflows/video_driver.yml/dispatches", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token.trim()}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ ref: "main", inputs: { prompt: promptText } }),
                });

                if (res.ok) {
                    stage.innerHTML = `<span style="color:var(--accent-3);font-size:13.5px;">Kaggle T4 ক্লাস্টারে ভিডিও রেন্ডার শুরু হয়েছে। কিছুক্ষণ পর GitHub Releases ট্যাবে .mp4 ফাইলটি পেয়ে যাবে।</span>`;
                    showToast("Kaggle Video Started");
                } else {
                    stage.innerHTML = `<span style="color:#f87171;">Dispatch Failed (HTTP ${res.status})</span>`;
                }
            } catch (err) {
                stage.innerHTML = `<span style="color:#f87171;">Error: ${escapeHtml(err.message)}</span>`;
            }
        }

        function downloadStudioMedia() {
            if (!latestStudioImage) return showToast("Generate an image first");
            const a = document.createElement("a");
            a.href = latestStudioImage;
            a.download = `argent-art-${Date.now()}.jpg`;
            a.target = "_blank";
            a.click();
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
        updateEngineUI();
        renderHistory();
        renderMessages();
    </script>
