<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Argent Viron Omega Black</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080a0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts: Inter, Orbitron & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #080a0d;
            --panel-bg: #11151c;
            --panel-elevated: #161b24;
            --accent-neon: #00ffaa;
            --accent-cyber: #9d4edd;
            --border-metal: #1e293b;
            --border-highlight: #334155;
            --text-glow: #f1f5f9;
            --text-dim: #64748b;
            --radius-luxury: 16px;

            --bubble-user: #1a2a3a;
            --bubble-user-border: #2e4760;
            --bubble-ai: #1a122c;
            --bubble-ai-border: #44246d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(0, 255, 170, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 85% 100%, rgba(157, 78, 221, 0.05) 0%, transparent 45%);
            color: var(--text-glow);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }

        .header-panel {
            background: linear-gradient(180deg, rgba(22, 27, 36, 0.95) 0%, rgba(17, 21, 28, 0.95) 100%);
            backdrop-filter: blur(12px);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-metal);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65);
            flex-shrink: 0;
            z-index: 50;
            gap: 10px;
        }

        .core-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-glow);
            white-space: nowrap;
        }

        .pulse-indicator {
            width: 8px;
            height: 8px;
            background-color: var(--accent-neon);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-neon);
            animation: blink 2s infinite ease-in-out;
            flex-shrink: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key-btn {
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid rgba(157, 78, 221, 0.4);
            color: #c77dff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .key-btn:hover {
            background: rgba(157, 78, 221, 0.3);
            border-color: #c77dff;
        }

        .version-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: var(--accent-neon);
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 255, 170, 0.05);
            border: 1px solid rgba(0, 255, 170, 0.3);
            white-space: nowrap;
        }

        .container-box {
            flex: 1;
            overflow-y: hidden;
            padding: 14px 16px 88px 16px;
            display: flex;
            flex-direction: column;
        }

        .view-tab {
            display: none;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            overflow: hidden;
        }

        .view-tab.active { display: flex; }

        .audio-control-layer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(0, 255, 170, 0.04) 0%, rgba(17, 21, 28, 0.6) 100%);
            border: 1px solid var(--border-metal);
            padding: 9px 14px;
            border-radius: var(--radius-luxury);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .speech-toggle-btn {
            background: rgba(0, 255, 170, 0.08);
            border: 1px solid rgba(0, 255, 170, 0.25);
            color: var(--accent-neon);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .chat-stream-viewport {
            background: linear-gradient(145deg, #090c12 0%, #0d1117 100%);
            border: 1px solid var(--border-metal);
            border-radius: var(--radius-luxury);
            flex: 1;
            min-height: 200px;
            padding: 16px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            user-select: text;
            scroll-behavior: smooth;
        }

        .chat-msg-row { display: flex; width: 100%; animation: fadeIn 0.25s ease forwards; }
        .chat-msg-row.user { justify-content: flex-end; }
        .chat-msg-row.ai { justify-content: flex-start; }

        .chat-bubble.user-bubble {
            background: var(--bubble-user);
            border: 1px solid var(--bubble-user-border);
            border-radius: 18px 18px 4px 18px;
            max-width: 85%;
            padding: 12px 14px;
            color: #e2e8f0;
        }

        .chat-bubble.ai-bubble {
            background: var(--bubble-ai);
            border: 1px solid var(--bubble-ai-border);
            border-radius: 18px 18px 18px 4px;
            max-width: 90%;
            padding: 14px 16px;
            color: #f3e8ff;
        }

        .bubble-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 5px;
            margin-bottom: 8px;
            gap: 12px;
        }

        .bubble-meta .ai-tag { color: #c084fc; font-weight: 600; }
        .bubble-meta .user-tag { color: #38bdf8; font-weight: 600; }

        .bubble-content {
            font-size: 13.5px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .bubble-content.mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: #a7f3d0;
        }

        .bubble-actions-matrix {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .act-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.28);
            color: #d8b4fe;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
        }

        .gemini-bar-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: linear-gradient(180deg, var(--panel-elevated) 0%, var(--panel-bg) 100%);
            border: 1px solid var(--border-metal);
            border-radius: var(--radius-luxury);
            padding: 8px 12px 8px 14px;
            flex-shrink: 0;
        }

        .gemini-main-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 8px;
        }

        .core-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-glow);
            font-size: 14px;
            padding: 8px 4px;
            outline: none;
            min-width: 0;
        }

        .icon-trigger {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-metal);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: var(--text-glow);
            flex-shrink: 0;
        }

        .send-inline { background-color: var(--accent-neon); color: #040608; border: none; font-weight: 700; }
        .send-inline-cyber { background-color: var(--accent-cyber); color: #ffffff; border: none; font-weight: 700; }

        .media-canvas {
            width: 100%;
            flex: 1;
            min-height: 220px;
            background: radial-gradient(circle at center, #0e131a 0%, #05070a 100%);
            border-radius: var(--radius-luxury);
            border: 1px solid var(--border-metal);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
        }

        .grid-trigger {
            padding: 13px 14px;
            border-radius: var(--radius-luxury);
            font-weight: 700;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-neon-outline { background: rgba(0
